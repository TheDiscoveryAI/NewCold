:root{--bg:#0a0b10;--p1:#12141c;--p2:#181b25;--bd:#242836;--tx:#eceff6;--mu:#8a90a3;--bl:#3b6cf0;--bl2:#5b8cff;--am:#f5a524;--tl:#4fe3c1;--rd:#ef4444;--gn:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Inter,'Liberation Sans',sans-serif;color:var(--tx);overflow:hidden;font-size:12px}
#root,.app{height:100%}
.app{display:grid;grid-template-columns:62px minmax(0,1fr)}
.sb{background:#07080c;border-right:1px solid #171923;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:3px;overflow:hidden}
.lg0{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5b8cff,#2742c4);display:grid;place-items:center;font-weight:700;font-size:16px;margin-bottom:10px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#656b7e;cursor:pointer;flex:none}
.ic:hover{color:#fff;background:#14161f}.ic.on{background:var(--bl);color:#fff}
main{display:flex;flex-direction:column;padding:14px 22px 16px;min-width:0;min-height:0;height:100%}
header{display:flex;align-items:center;justify-content:space-between;flex:none}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px}.crumb{font-size:10.5px;color:var(--mu);margin-top:2px}
.hr2{display:flex;align-items:center;gap:10px}
.chip{display:flex;gap:6px;align-items:center;background:var(--p1);border:1px solid var(--bd);border-radius:14px;padding:5px 11px;font-size:10.5px;color:#cfd3de}
.pill{display:flex;gap:14px;background:var(--p1);border-radius:20px;padding:8px 16px;color:var(--mu)}
.avt{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f5a524,#e8890c);display:grid;place-items:center;font-weight:700;font-size:10.5px;color:#1a1204}
.tabs{display:flex;gap:7px;margin:10px 0 10px;flex:none;flex-wrap:wrap}
.tab{border:1px solid #bfc4d2;color:#fff;border-radius:16px;padding:4px 12px;font-size:10.5px;cursor:pointer}
.tab.on{background:var(--bl);border-color:var(--bl)}.tab.pri2{margin-left:auto;background:#fff;color:#0a0b10;border-color:#fff;font-weight:600;display:flex;gap:4px;align-items:center}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:11px}
.card{background:var(--p1);border-radius:15px;padding:13px 15px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card h3{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex:none}
.card h3 .mu,.mu{color:var(--mu);font-weight:400}
.act{margin-left:auto;margin-right:24px;font-style:normal;font-size:10px;color:var(--bl2);font-weight:500}
.grad{background:linear-gradient(135deg,#4f8cff 0%,#2742c4 100%)}
.an{position:absolute;top:7px;right:7px;width:19px;height:19px;border-radius:50%;background:var(--am);color:#1a1204;font:700 10.5px Inter;display:grid;place-items:center;text-decoration:none;z-index:3;box-shadow:0 0 0 3px rgba(245,165,36,.25)}
.kpi{justify-content:center}.kl{font-size:10.5px;opacity:.8}.kv{font-size:26px;font-weight:700;margin:3px 0;letter-spacing:-.5px}
.kd{font-size:10.5px;font-weight:600}.kd.up{color:#4ade80}.kd.dn{color:#ff6b6b}.grad .kd{color:#fff;opacity:.95}.ks{font-size:10px;color:var(--mu);margin-top:2px}.grad .ks{color:#dbe4ff}
.kpi .ch{flex:1;min-height:14px;margin-top:2px}
.ch{flex:1;min-height:0;min-width:0;position:relative}
.ax{font:9px Inter;fill:#7d8396}.dc{font:700 17px Inter;fill:#fff}
.tw{flex:1;min-height:0;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:10.3px}
th{text-align:left;color:var(--mu);font-weight:500;padding:5px 7px;border-bottom:1px solid var(--bd);font-size:9.6px;white-space:nowrap}
td{padding:5.2px 7px;border-bottom:1px solid #1b1e29;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tr.sel td{background:rgba(59,108,240,.16)}tr.sel td:first-child{box-shadow:inset 2px 0 var(--bl)}
.bd{display:inline-block;padding:1.5px 8px;border-radius:9px;font-size:9.2px;font-weight:600}
.bd.rd{background:rgba(239,68,68,.16);color:#ff7b7b}.bd.am{background:rgba(245,165,36,.16);color:#f7b955}.bd.bl{background:rgba(59,108,240,.2);color:#8fb0ff}
.bd.gn{background:rgba(34,197,94,.15);color:#4ade80}.bd.gy{background:rgba(138,144,163,.16);color:#aab0c2}.bd.tl{background:rgba(79,227,193,.14);color:#4fe3c1}
.pg{display:inline-block;width:46px;height:5px;border-radius:3px;background:#262a38;vertical-align:middle;margin-right:5px;overflow:hidden}.pg i{display:block;height:100%;border-radius:3px}.pv{font-size:9.5px}
.leg{font-size:9.5px;color:var(--mu);margin-top:3px}
.dnc{display:flex;flex:1;min-height:0;gap:8px;align-items:stretch}.dnc .ch{flex:1.1}.lg{flex:1;font-size:10px;display:flex;flex-direction:column;gap:5px}.lg div{display:flex;align-items:center;gap:6px;color:#cfd3de}.lg i{width:8px;height:8px;border-radius:2px;flex:none}.lg b{margin-left:auto;font-weight:600}
.hb{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;justify-content:space-around}
.hr{display:grid;grid-template-columns:40% 1fr 12%;align-items:center;gap:8px;font-size:10px;color:#cfd3de}.hr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hr b{text-align:right;font-weight:600}
.ht{height:7px;background:#232635;border-radius:4px;overflow:hidden}.ht i{display:block;height:100%;border-radius:4px}
.hr.s2{grid-template-columns:1fr auto;border-bottom:1px solid #1b1e29;padding-bottom:5px}
.kb{display:flex;gap:9px;flex:1;min-height:0}.kc{flex:1;background:#0e1016;border-radius:11px;padding:8px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.kc h4{margin:0 0 2px;font-size:10px;color:var(--mu);font-weight:600;display:flex;justify-content:space-between}.kc h4 b{background:#1e2230;border-radius:8px;padding:0 6px;color:#cfd3de}
.kk{background:var(--p2);border-radius:9px;padding:7px 8px;border-left:3px solid #3b6cf0}.kk.rd{border-color:#ef4444}.kk.am{border-color:#f5a524}.kk.gn{border-color:#22c55e}
.kt{font-size:10.2px;font-weight:600;line-height:1.25}.ks2{font-size:9.2px;color:var(--mu);margin:2px 0 5px}.kf{display:flex;justify-content:space-between;align-items:center}
.av{width:18px;height:18px;border-radius:50%;background:#2a3050;display:grid;place-items:center;font-size:8px;font-weight:700}
